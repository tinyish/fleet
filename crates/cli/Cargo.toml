[package]
name = "cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
clap.workspace = true
console.workspace = true
cliclack.workspace = true
fleet-core.workspace = true
strum = { workspace = true, optional = true }

[features]
# `fleet specimen`: every line the CLI can print. Never in a release build.
specimen = ["dep:strum", "fleet-core/specimen"]
# `fleet debug`: launch, list and stop agents' sessions by hand, printing
# the supervisor's replies as JSON. Never in a release build.
debug = []

[lints]
workspace = true
