[package]
name = "fleet-adapter-sdk"
# Its own version, apart from fleet's: adapters pin it by the tag
# adapter-sdk-v<version>, and a change to a protocol bumps it.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "fleet_adapter_sdk"

[dependencies]
serde.workspace = true
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[features]
# What anyone writing an adapter in Rust needs: the run loop, helpers, a
# test kit and the conformance checks. tinyfleet never turns it on.
kit = ["dep:serde_json"]

[lints]
workspace = true
