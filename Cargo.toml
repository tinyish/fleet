[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/tinyish/fleet"

[workspace.dependencies]
fleet-core = { path = "crates/core" }
state = { path = "crates/state" }
service = { path = "crates/service" }
git = { path = "crates/git" }
clap = { version = "4", features = ["derive"] }
cli = { path = "crates/cli" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
console = { version = "0.16", default-features = false }
cliclack = "0.5"
strum = { version = "0.28", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
supervisor = { path = "crates/supervisor" }

[workspace.lints.rust]
warnings = { level = "deny", priority = -2 }
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
too_many_lines = "deny"
